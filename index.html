<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>भारत रूट | Swadeshi Direct Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b132b; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .box { width: 100%; max-width: 620px; text-align: center; }
    .brand { font-size: 2.4rem; font-weight: 800; margin-bottom: 6px; }
    .saffron { color: #f97316; } .white { color: #ffffff; } .green { color: #22c55e; }
    .sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
    .search-row { display: flex; background: #1c2541; border: 2px solid #3a506b; border-radius: 40px; padding: 6px 8px 6px 20px; }
    .search-row:focus-within { border-color: #f97316; }
    input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 1.05rem; }
    button { background: #f97316; color: #fff; border: none; padding: 12px 24px; font-weight: 700; border-radius: 30px; cursor: pointer; }
    button:hover { background: #ea580c; }
    #msg { margin-top: 1.2rem; min-height: 24px; font-size: 0.95rem; }
    .suc { color: #22c55e; font-weight: 600; }
    .err { color: #f87171; }
    .quick { margin-top: 2.5rem; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .pill { background: #1c2541; border: 1px solid #3a506b; color: #cbd5e1; padding: 8px 14px; border-radius: 10px; font-size: 0.82rem; text-decoration: none; }
    .pill:hover { border-color: #22c55e; color: #fff; }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand"><span class="saffron">भारत</span> <span class="white">रूट</span><span class="green">.इन</span></div>
    <div class="sub">100% स्वतंत्र स्वदेशी इंजन — सर्च करते ही सीधे आधिकारिक पोर्टल पर</div>

    <div class="search-row">
      <input type="text" id="q" placeholder="लिखें: UPSC, Scholarship, PM Kisan, MGKVP, Samarth..." autofocus>
      <button onclick="go()">खोजें</button>
    </div>

    <div id="msg"></div>

    <div class="quick">
      <a class="pill" href="https://upsc.gov.in" target="_blank" rel="noopener noreferrer">1. UPSC</a>
      <a class="pill" href="https://scholarships.gov.in" target="_blank" rel="noopener noreferrer">2. Scholarship (NSP)</a>
      <a class="pill" href="https://pmkisan.gov.in" target="_blank" rel="noopener noreferrer">3. PM Kisan</a>
      <a class="pill" href="https://mgkvp.ac.in" target="_blank" rel="noopener noreferrer">4. MGKVP Varanasi</a>
      <a class="pill" href="https://samarth.edu.in" target="_blank" rel="noopener noreferrer">5. Samarth eGov</a>
    </div>
  </div>

  <script>
    const DIRECT_PORTALS = [
      {
        name: "UPSC Official Portal",
        url: "https://upsc.gov.in",
        keys: ["upsc", "ias", "ips", "capf", "cds", "nda", "assistant commandant"]
      },
      {
        name: "National Scholarship Portal",
        url: "https://scholarships.gov.in",
        keys: ["scholarship", "nsp", "chatravriti", "छात्रवृत्ति", "welfare"]
      },
      {
        name: "PM Kisan Samman Nidhi",
        url: "https://pmkisan.gov.in",
        keys: ["pm kisan", "kisan", "farmer", "किसान", "सम्मान निधि", "6000"]
      },
      {
        name: "MGKVP Varanasi",
        url: "https://mgkvp.ac.in",
        keys: ["mgkvp", "kashi vidyapith", "विद्यापीठ", "bca", "result", "exam form"]
      },
      {
        name: "Samarth eGov Student Portal",
        url: "https://samarth.edu.in",
        keys: ["samarth", "student", "समर्थ", "enrollment", "student portal"]
      }
    ];

    const routeCache = new Map();

    function isSafeUrl(raw) {
      try {
        const u = new URL(raw);
        return u.protocol === "https:" || u.protocol === "http:";
      } catch {
        return false;
      }
    }

    function resolveRoute(rawQuery) {
      const q = String(rawQuery || "").slice(0, 80).trim().toLowerCase();
      if (!q) return null;
      if (routeCache.has(q)) return routeCache.get(q);

      const match = DIRECT_PORTALS.find(
        (p) => p.name.toLowerCase().includes(q) || p.keys.some((k) => q.includes(k) || k.toLowerCase().includes(q))
      );

      const result = match && isSafeUrl(match.url) ? { name: match.name, url: match.url } : null;
      if (routeCache.size >= 500) routeCache.clear();
      routeCache.set(q, result);
      return result;
    }

    const inp = document.getElementById("q");
    const msg = document.getElementById("msg");

    inp.addEventListener("keypress", (e) => { if (e.key === "Enter") go(); });

    function go() {
      const val = inp.value.trim();
      if (!val) {
        msg.className = "err";
        msg.innerText = "कृपया कोई कीवर्ड लिखें।";
        return;
      }

      const data = resolveRoute(val);
      if (data && data.url) {
        msg.className = "suc";
        msg.innerText = "✓ '" + data.name + "' मिला! सीधे ले जाया जा रहा है...";
        setTimeout(() => { window.location.assign(data.url); }, 500);
      } else {
        msg.className = "err";
        msg.innerText = "डेटाबेस में नहीं मिला। इन 5 में से खोजें: UPSC, Scholarship, Kisan, MGKVP, Samarth";
      }
    }
  </script>
</body>
  </html>
